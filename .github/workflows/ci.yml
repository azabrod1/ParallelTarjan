name: C++ regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPARALLEL_TARJAN_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        if: matrix.sanitizer == 'address'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Test core and dictionaries with ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure -L tsan-core

name: C++ regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark smoke run (checks every result against the sequential algorithm)
        run: ./build/ptarjan_bench --graph clusters --vertices 200000 --threads 1,2,4 --runs 2

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPTARJAN_SANITIZER=${{ matrix.sanitizer }} -DPTARJAN_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        if: matrix.sanitizer == 'address'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Test core with ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure -L tsan-core

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: >
          pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror
          include/ptarjan/*.hpp src/*.cpp src/parallel/* bench/* examples/*.cpp tests/*.cpp

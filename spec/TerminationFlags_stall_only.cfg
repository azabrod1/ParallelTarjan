\* OLD protocol, isolates the stall mechanism.  With one root and no suspensions
\* a worker can never obtain work after setting its bit (the queue is exhausted
\* once next() returns null or the only claim fails, and Pending stays empty),
\* so neither stale-bit route exists: NoStaleBit/NoEarlyExit must hold, and any
\* Termination failure is caused by the stall alone.
CONSTANTS
  Workers = {w1, w2, w3}
  NRoots = 1
  MaxSusp = 0
  AllowStall = TRUE
  MaxStalls = 1
  RealisticRoots = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoEarlyExit DoneOnExit AllExitedAllDone NoStaleBit
PROPERTIES Termination

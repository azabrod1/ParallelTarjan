\* 2a280d9 liveness (blocked on a complete cell ~> resumed by exactly one party); shrunk for the 2-core cap: MaxLives 1 (no recycling), stale entries come from transfers
CONSTANTS
  Workers = {w1, w2}
  Searches = {s1, s2}
  Cells = {c1, c2}
  SCCs = {{c1, c2}}
  Cap = 2
  MaxLives = 1
  MaxTransfers = 1
  LazyList = TRUE
  NoRecheck = FALSE
  BlindResume = FALSE
  CheckThenStore = FALSE
  RelaxedEntry = FALSE
  NULL = NULL
SPECIFICATION Spec
INVARIANTS TypeOK NoDoubleResume NoLostWakeup
PROPERTIES EventuallyResumed

\* OLD protocol with RealisticRoots = FALSE (any root may be skipped / lose its
\* claim at any time, as in Termination.tla).  Kept only for comparison: its
\* first counterexample skips roots before any search started, which the real
\* code cannot do.  See TerminationFlags_safety.cfg for the realizable trace.
CONSTANTS
  Workers = {w1, w2, w3}
  NRoots = 3
  MaxSusp = 3
  AllowStall = FALSE
  MaxStalls = 1
  RealisticRoots = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoEarlyExit DoneOnExit AllExitedAllDone
